<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Disintegrate</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        main {
            position: relative;
            display: grid;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            place-items: center;
            isolation: isolate;
        }

        #particles {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .gold-bar {
            position: relative;
            z-index: 2;
            width: 10px;
            height: 50vh;
            height: 50dvh;
            background: #d4af37;
        }
    </style>
</head>
<body>
    <main aria-label="Disintegrate visual experiment">
        <canvas id="particles" aria-hidden="true"></canvas>
        <div class="gold-bar" aria-hidden="true"></div>
    </main>

    <script src="./JS/disintegrate.js" defer></script>
</body>
</html>
