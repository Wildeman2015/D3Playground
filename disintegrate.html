<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Disintegrate</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        main {
            position: relative;
            display: grid;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            place-items: center;
            isolation: isolate;
        }

        #particles {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .gold-bar {
            position: relative;
            z-index: 2;
            width: 10px;
            height: 50vh;
            height: 50dvh;
            background: #d4af37;
        }
    </style>
</head>
<body>
    <main aria-label="Disintegrate visual experiment">
        <canvas id="particles" aria-hidden="true"></canvas>
        <div class="gold-bar" aria-hidden="true"></div>
    </main>

    <script>
        (() => {
            const canvas = document.getElementById("particles");
            const ctx = canvas.getContext("2d");
            const bar = document.querySelector(".gold-bar");

            let width = 0;
            let height = 0;
            let dpr = 1;
            let particles = [];
            let lastTime = 0;
            let emissionCarry = 0;

            const settings = {
                emissionRate: 30,
                lifetimeMin: 3.5,
                lifetimeMax: 7.5,
                emissionZone: 0.22
            };

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);
                canvas.style.width = width + "px";
                canvas.style.height = height + "px";
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function emissionPoint() {
                const rect = bar.getBoundingClientRect();

                // Squaring the random value concentrates emission near the top edge.
                const verticalPosition = Math.pow(Math.random(), 1.8);

                return {
                    x: rect.right + (Math.random() - 0.5) * 2,
                    y: rect.top + verticalPosition * rect.height * settings.emissionZone,
                    verticalPosition
                };
            }

            function createParticle() {
                const origin = emissionPoint();
                const life = settings.lifetimeMin +
                    Math.random() * (settings.lifetimeMax - settings.lifetimeMin);

                // Lower points leave at a steeper downward angle; all particles move right.
                const launchAngle = -0.28 + origin.verticalPosition * 0.48 +
                    (Math.random() - 0.5) * 0.16;
                const speed = 18 + Math.random() * 17;

                particles.push({
                    x: origin.x,
                    y: origin.y,
                    vx: Math.cos(launchAngle) * speed,
                    vy: Math.sin(launchAngle) * speed,
                    size: 0.45 + Math.pow(Math.random(), 1.7) * 1.9,
                    life,
                    age: 0,
                    phase: Math.random() * Math.PI * 2,
                    drift: 2 + Math.random() * 7,
                    shade: Math.random()
                });
            }

            function drawParticle(p, dt, now) {
                const progress = p.age / p.life;
                const fadeIn = Math.min(progress * 6, 1);
                const fadeOut = Math.min((1 - progress) * 2.1, 1);
                const alpha = fadeIn * fadeOut * (0.22 + p.shade * 0.3);

                // Small, slow eddies soften the straight launch paths without obscuring them.
                const turbulence = Math.sin(now * 0.0005 + p.phase + p.x * 0.004);
                p.vy += turbulence * p.drift * dt * 0.1;
                p.vx += Math.cos(now * 0.00035 + p.phase) * 0.35 * dt;
                p.vx = Math.max(8, p.vx);
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.age += dt;

                if (alpha <= 0) return;

                const radius = p.size * (0.85 + progress * 0.45);
                const angle = Math.atan2(p.vy, p.vx);

                // Tight, low-opacity edge softness; the darker core reads as ash or soot.
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(angle);
                ctx.fillStyle = `rgba(190, 151, 65, ${alpha * 0.24})`;
                ctx.beginPath();
                ctx.ellipse(0, 0, radius * 1.8, radius * 1.25, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = `rgba(211, 177, 105, ${alpha})`;
                ctx.beginPath();
                ctx.ellipse(0, 0, radius, Math.max(0.35, radius * 0.62), 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function animate(timestamp) {
                if (!lastTime) lastTime = timestamp;
                const dt = Math.min((timestamp - lastTime) / 1000, 0.04);
                lastTime = timestamp;

                ctx.clearRect(0, 0, width, height);

                emissionCarry += settings.emissionRate * dt;
                while (emissionCarry >= 1) {
                    createParticle();
                    emissionCarry -= 1;
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    drawParticle(p, dt, timestamp);
                    if (p.age >= p.life || p.x > width + 30 ||
                        p.y < -30 || p.y > height + 30) {
                        particles.splice(i, 1);
                    }
                }

                requestAnimationFrame(animate);
            }

            window.addEventListener("resize", resize);
            resize();
            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
